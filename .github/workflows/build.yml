name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DEUI_BUILD_APPS=OFF -DEUI_BUILD_USER_APPS=ON -DEUI_BUILD_TEST_FIXTURES=OFF

    - name: Build
      run: cmake --build build --target heart_rate --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: heart_rate
        path: build/Release/heart_rate.exe
